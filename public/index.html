<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>마중 — 공항 마중 출발 시각</title>
  <meta name="description" content="항공편 도착 정보와 이동 시간을 바탕으로 추천 출발 시각을 알려드려요.">
  <link rel="icon" href="assets/icons/trail-mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>
  <!--
    양옆 모션 배경 (768px 이상에서만 보인다): 점선 항적을 따라 비행기가 천천히 난다. 장식일 뿐이라 글자·버튼·정보를 두지 않고, 화면 읽기 프로그램에서는 숨긴다.
    SVG 는 js/ui/components/sideBackground.js 가 768px 이상일 때만 채운다. (767px 이하에서는 아예 만들지 않는다)
    색은 Cream·Peach·Dusk Blue 만 쓴다. 모양·움직임은 css/layout.css 에서 정하고, "움직임 줄이기"가 켜져 있으면 멈춘다.
  -->
  <div class="side-bg" aria-hidden="true"></div>

  <div class="app">
    <header class="app__header">
      <img src="assets/icons/trail-mark.svg" width="32" height="32" alt="">
      <strong>마중</strong>
      <span class="caption">majung</span>
      <!-- 상단 표시: js/app.js가 모드에 맞는 문구를 채운다. 항공편·주소·이동 시간이 모두 실제가 되면 숨긴다. -->
      <span class="mock-badge" hidden></span>
    </header>

    <!-- 화면 내용은 js/app.js가 단계에 맞게 채운다. -->
    <main class="app__main"></main>

    <footer class="app__footer"></footer>
  </div>

  <noscript>이 서비스는 JavaScript가 필요해요. 브라우저 설정에서 JavaScript를 켜 주세요.</noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
